name: Metra Tracker
version: "0.4.1"
slug: metra_tracker
description: Track your Metra trains (delays, cancellations, service alerts) as Home Assistant entities via MQTT.
url: https://metra.com/metra-gtfs-api
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
services:
  - mqtt:need
ingress: true
ingress_port: 8099
panel_icon: mdi:map-marker-path
panel_title: Metra Map
options:
  api_token: ""
  trips: []
  commute_days: weekdays
  delay_threshold_min: 5
  delay_change_min: 3
  log_level: info
schema:
  api_token: password
  trips:
    - name: str
      line: str
      from_station: str
      to_station: str
      departure: match(^\d{1,2}:\d{2}$)
      days: list(weekdays|weekends|daily)
  commute_days: list(weekdays|weekends|daily)
  delay_threshold_min: int(1,60)
  delay_change_min: int(1,30)
  log_level: list(debug|info|warning|error)
